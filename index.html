<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAI Tracking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0D0D1A;--card:#12122A;--card2:#1A1A35;
  --accent:#00E676;--red:#FF554F;--blue:#2979FF;
  --purple:#AA00FF;--orange:#FF9800;--yellow:#FFD600;
  --text:#FFFFFF;--sub:#8888AA;--border:#2A2A5A;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.header{background:linear-gradient(135deg,#1a1a3e,#0d0d25);padding:0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;display:flex;flex-direction:column}
.header-main{padding:10px 14px;display:flex;align-items:center;gap:10px;width:100%}
.header-logo{background:linear-gradient(135deg,#e05c1a,#1565c0);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:1px;box-shadow:0 2px 10px rgba(224,92,26,.4)}
.header h1{font-size:15px;font-weight:800;letter-spacing:.3px}
.header p{font-size:10px;color:var(--sub);margin-top:1px}
.header-right{margin-left:auto;display:flex;gap:6px}
.hbtn{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;transition:.2s}
.hbtn:hover{background:var(--border)}
/* MARQUEE */
.header-ticker{width:100%;background:rgba(0,230,118,.08);border-top:1px solid rgba(0,230,118,.15);overflow:hidden;height:26px;display:flex;align-items:center}
.ticker-inner{display:flex;align-items:center;white-space:nowrap;animation:ticker-scroll 30s linear infinite}
.ticker-inner:hover{animation-play-state:paused}
@keyframes ticker-scroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.ticker-text{font-size:11px;color:#00E676;font-weight:600;padding:0 40px}
.ticker-sep{color:rgba(0,230,118,.4);font-size:10px}

/* ── TABS ── */
.tab-bar{display:flex;background:var(--card);border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:11px 8px;font-size:12px;font-weight:700;border:none;background:transparent;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;transition:.2s;font-family:inherit}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-pane{display:none}
.tab-pane.active{display:block}

.container{max-width:800px;margin:0 auto;padding:14px}

/* ── SEARCH ── */
.search-wrap{display:flex;gap:8px;margin-bottom:18px}
.search-input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:12px;font-size:14px;outline:none;transition:.2s}
.search-input:focus{border-color:var(--accent)}
.search-btn{background:var(--accent);color:#000;border:none;padding:11px 18px;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px}
.qr-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:12px;cursor:pointer;font-size:18px}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.card-title{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.s-active{background:rgba(0,230,118,.15);color:var(--accent);border:1px solid rgba(0,230,118,.3)}
.s-done{background:rgba(41,121,255,.15);color:var(--blue);border:1px solid rgba(41,121,255,.3)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-item{background:var(--card2);border-radius:10px;padding:10px 12px}
.info-label{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.info-value{font-size:13px;font-weight:700;color:var(--text);word-break:break-word}
@media(max-width:400px){.info-grid{grid-template-columns:1fr}}
.progress-wrap{margin:10px 0}
.progress-track{background:var(--card2);border-radius:99px;height:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#00BFA5);transition:width .6s ease}
.progress-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--sub);margin-top:4px}
#tracking-map{height:320px;border-radius:12px;border:1px solid var(--border);overflow:hidden}
.map-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.loc-card{background:linear-gradient(135deg,#0d1a2e,#1a1a3e);border:1px solid #1E3A5F;border-radius:16px;padding:16px;margin-bottom:14px}
.loc-city-name{font-size:22px;font-weight:800;margin-bottom:4px}
.loc-step-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,230,118,.15);color:var(--accent);border:1px solid rgba(0,230,118,.3);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:10px}
.loc-update{font-size:11px;color:var(--sub);margin-top:8px}
.loc-pulse{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,230,118,.4)}70%{box-shadow:0 0 0 10px rgba(0,230,118,0)}100%{box-shadow:0 0 0 0 rgba(0,230,118,0)}}
.timeline{position:relative;padding-left:30px}
.timeline::before{content:'';position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:14px}
.tl-dot{position:absolute;left:-26px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border:2px solid var(--bg)}
.tl-dot.done{background:var(--accent);color:#000}
.tl-dot.active{background:var(--orange);color:#000;box-shadow:0 0 10px rgba(255,152,0,.7);animation:pulse2 1s infinite}
.tl-dot.pending{background:var(--card2);color:var(--sub);border-color:var(--border)}
@keyframes pulse2{0%,100%{box-shadow:0 0 8px rgba(255,152,0,.7)}50%{box-shadow:0 0 18px rgba(255,152,0,.9)}}
.tl-content{background:var(--card2);border-radius:10px;padding:10px 12px;border-left:3px solid transparent}
.tl-content.done{border-left-color:var(--accent)}
.tl-content.active{border-left-color:var(--orange);background:#1a1a25}
.tl-label{font-size:13px;font-weight:700}
.tl-time{font-size:11px;color:var(--sub);margin-top:2px}
.tl-status{font-size:10px;margin-top:2px;font-weight:600}
.comment-item{display:flex;gap:10px;margin-bottom:12px}
.comment-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1565C0,#0D47A1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.comment-bubble{background:var(--card2);border-radius:12px;padding:9px 12px;flex:1;min-width:0}
.comment-name{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:3px}
.comment-text{font-size:13px;line-height:1.4;word-break:break-word}
.comment-time-small{font-size:10px;color:var(--sub);margin-top:4px}
.comment-location{font-size:10px;color:var(--orange);margin-top:2px;display:flex;align-items:center;gap:3px}
.btn{padding:10px 18px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#000}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;max-width:380px;width:100%}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;text-align:center}
#qr-reader-container{margin:10px 0;border-radius:12px;overflow:hidden}
.modal-close{display:block;margin:12px auto 0;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px 24px;border-radius:12px;cursor:pointer;font-size:13px}
.stars{display:flex;gap:4px;margin:8px 0}
.star{font-size:26px;cursor:pointer;color:var(--border);transition:.15s}
.star.active{color:var(--yellow)}
.feedback-textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:10px;font-size:13px;resize:vertical;min-height:70px;outline:none;margin-top:6px}
.feedback-item-dark{background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--accent);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;transition:.3s;opacity:0;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:12px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.voucher{background:linear-gradient(135deg,#0a1628,#0d1a2e);border:1px solid var(--blue);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.voucher-row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.04);padding:9px 12px;border-radius:9px;margin-bottom:6px}
.voucher-key{font-size:11px;color:var(--sub)}
.voucher-val{font-size:13px;font-weight:700}

/* ── POST TRACKING TAB styles (adapted to dark theme) ── */
.pt-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.pt-section h3{color:var(--text);font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pt-swiper{width:100%;height:320px;border-radius:12px;background:#000;margin-bottom:10px}
.pt-swiper .swiper-slide{display:flex;align-items:center;justify-content:center;background:#000}
.pt-swiper .swiper-slide img{max-width:100%;max-height:100%;object-fit:contain;cursor:pointer}
.pt-swiper .swiper-slide video{max-width:100%;max-height:100%;width:100%}
.swiper-pagination-bullet{background:rgba(255,255,255,.5)!important}
.swiper-pagination-bullet-active{background:var(--accent)!important}
.swiper-button-prev,.swiper-button-next{color:var(--accent)!important}
.pt-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pt-detail-card{background:var(--card2);border-radius:10px;padding:10px 12px}
.pt-detail-label{font-size:10px;color:var(--sub);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.pt-detail-value{font-size:13px;font-weight:700;color:var(--text);word-break:break-all}
@media(max-width:400px){.pt-detail-grid{grid-template-columns:1fr}}
.pt-comment-item{background:var(--card2);border-radius:10px;padding:12px;margin-bottom:10px}
.pt-comment-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pt-comment-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1565C0,#0D47A1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden}
.pt-comment-avatar img{width:100%;height:100%;object-fit:cover}
.pt-comment-username{font-size:13px;font-weight:700;color:var(--accent)}
.pt-comment-time{font-size:10px;color:var(--sub)}
.pt-comment-text{font-size:13px;color:var(--text);line-height:1.5}
.pt-feedback-item{background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px}
.pt-feedback-rating{color:var(--yellow);font-size:15px;margin-bottom:4px}
.pt-feedback-text{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:4px}
.pt-feedback-meta{font-size:10px;color:var(--sub)}
.pt-admin-item{background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px;border-left:3px solid var(--yellow)}
.pt-admin-badge{background:var(--yellow);color:#000;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-right:6px}
.pt-admin-time{font-size:10px;color:var(--sub)}
.pt-admin-text{font-size:13px;color:var(--text);line-height:1.5;margin-top:6px}
.pt-img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.pt-img-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;transition:.2s}
.pt-img-item:hover{transform:scale(1.04)}
.pt-img-item img,.pt-img-item video{width:100%;height:100%;object-fit:cover}
.pt-img-meta{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;padding:6px;font-size:9px}
.pt-video-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;background:rgba(0,0,0,.6);border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.pt-video-indicator::after{content:'▶';color:#fff;font-size:14px;margin-left:2px}
.pt-star-row{display:flex;gap:8px;margin:10px 0}
.pt-star{font-size:28px;cursor:pointer;color:var(--border);transition:.15s}
.pt-star.active{color:var(--yellow)}
.pt-upload-section{background:var(--card2);border-radius:12px;padding:14px;margin-top:10px}
.file-input-label{display:block;padding:10px;background:var(--blue);color:#fff;border-radius:10px;text-align:center;font-weight:700;font-size:13px;cursor:pointer}
.pt-img-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px}
.pt-preview-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden}
.pt-preview-item img,.pt-preview-item video{width:100%;height:100%;object-fit:cover}
.pt-preview-remove{position:absolute;top:3px;right:3px;background:rgba(220,38,38,.9);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.pt-post-stats{display:flex;gap:14px;padding:10px 0;font-size:13px;color:var(--sub)}
.pt-post-stats span{color:var(--text);font-weight:700}

/* ── LIGHTBOX (shared) ── */
.lb-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:2000;align-items:center;justify-content:center}
.lb-modal.active{display:flex}
.lb-img{max-width:90%;max-height:85%;border-radius:8px;transition:opacity .2s}
.lb-video{max-width:90%;max-height:85%;border-radius:8px;display:none}
.lb-close{position:absolute;top:16px;right:20px;color:#fff;font-size:36px;cursor:pointer;z-index:2001;background:rgba(0,0,0,.5);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:none;font-size:28px;padding:18px 14px;cursor:pointer;z-index:2001;border-radius:6px;transition:.2s}
.lb-nav:hover{background:rgba(0,0,0,.75)}
.lb-nav.prev{left:16px}
.lb-nav.next{right:16px}
.lb-counter{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;z-index:2001}
.lb-save{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;border:none;padding:10px 22px;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;z-index:2001}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-main">
    <div class="header-logo">SAI</div>
    <div>
      <h1 id="header-title">SAI Transport</h1>
      <p id="header-sub">Parcel Tracking System</p>
    </div>
    <div class="header-right">
      <button class="hbtn" onclick="showQrModal()">📷 Scan</button>
    </div>
  </div>
  <div class="header-ticker">
    <div class="ticker-inner">
      <span class="ticker-text">🚛 SAI Transport — BKK → မဲဆောက် → မြဝတီ → ဘားအံ → ပဲခူး → ရန်ကုန် → မန်လေး</span>
      <span class="ticker-sep">✦</span>
      <span class="ticker-text">📦 Tracking ID ထည့်ပြီး ကုန်ပစ္စည်း တည်နေရာ စစ်ပါ</span>
      <span class="ticker-sep">✦</span>
      <span class="ticker-text">📞 MAQ Office: 083 494 4787 &nbsp;|&nbsp; Ph: 09774904060, 09941287963</span>
      <span class="ticker-sep">✦</span>
    </div>
  </div>
  <!-- TABS -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-sai" onclick="switchTab('sai')">📦 SAI Tracking</button>
    <button class="tab-btn" id="tab-post" onclick="switchTab('post')">🖼 Post Tracking</button>
  </div>
</div>

<!-- TAB 1: SAI TRACKING -->
<div class="tab-pane active" id="pane-sai">
  <div class="container">
    <div class="search-wrap">
      <input class="search-input" id="search-input" type="text" placeholder="KST030626-268 ထည့်ပါ..." onkeydown="if(event.key==='Enter')doSearch()"/>
      <button class="search-btn" onclick="doSearch()">🔍</button>
      <button class="qr-btn" onclick="showQrModal()">📷</button>
    </div>
    <div id="app-content"></div>
  </div>
</div>

<!-- TAB 2: POST TRACKING -->
<div class="tab-pane" id="pane-post">
  <div class="container">
    <div class="search-wrap">
      <input class="search-input" id="pt-search-input" type="text" placeholder="Tracking ID ထည့်ပါ..." onkeydown="if(event.key==='Enter')ptDoSearch()"/>
      <button class="search-btn" onclick="ptDoSearch()">🔍</button>
    </div>
    <div id="pt-app-content">
      <div class="card" style="text-align:center;padding:32px 20px">
        <div style="font-size:48px;margin-bottom:10px">🖼</div>
        <h2 style="margin-bottom:6px;font-size:16px">Post Tracking</h2>
        <p style="color:var(--sub);font-size:12px">Tracking ID ထည့်ပြီး Post စစ်ပါ</p>
      </div>
    </div>
  </div>
</div>

<!-- QR MODAL -->
<div class="modal-overlay hidden" id="qr-modal">
  <div class="modal-box">
    <div class="modal-title">📷 QR Scan</div>
    <div id="qr-reader-container"></div>
    <input class="search-input" id="manual-input" type="text" placeholder="သို့မဟုတ် ID ရိုက်ထည့်ပါ" style="margin-top:10px"/>
    <div class="btn-row" style="justify-content:center;margin-top:10px">
      <button class="btn btn-primary" onclick="doManualSearch()">ရှာမည်</button>
      <button class="modal-close" onclick="closeQrModal()">✕ ပိတ်မည်</button>
    </div>
  </div>
</div>

<!-- LIGHTBOX (Post Tab) -->
<div class="lb-modal" id="lbModal" onclick="event.target===this&&lbClose()">
  <button class="lb-close" onclick="lbClose()">×</button>
  <button class="lb-nav prev" id="lbPrev" onclick="lbNav(-1)">‹</button>
  <button class="lb-nav next" id="lbNext" onclick="lbNav(1)">›</button>
  <img class="lb-img" id="lbImg" src="">
  <video class="lb-video" id="lbVideo" controls><source src="" type="video/mp4"></video>
  <div class="lb-counter" id="lbCounter"></div>
  <button class="lb-save" onclick="lbSave()">💾 Save</button>
</div>

<div class="toast" id="toast"></div>

<!-- Scripts -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>

function switchTab(name) {
  ['sai','post'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
    document.getElementById('pane-'+t).classList.toggle('active', t===name);
  });
  document.getElementById('header-sub').textContent =
    name==='sai' ? 'Parcel Tracking System' : 'Post Tracking System';
}

window.onload = () => {

function doSearch(){
  const v=document.getElementById('search-input').value.trim();
  if(!v) return showToast('Tracking ID ထည့်ပါ');
  history.pushState({},'','?id='+v);
  trackingId=v; loadAll(v);
}
function doManualSearch(){
  const v=document.getElementById('manual-input').value.trim();
  if(!v) return;
  closeQrModal();
  document.getElementById('search-input').value=v;
  trackingId=v; history.pushState({},'','?id='+v); loadAll(v);
}

function loadAll(id){
  saiData=null; locationData=null; commentsData=[];
  if(leafletMap){leafletMap.remove();leafletMap=null;driverMarker=null;}
  if(_locListener){db.ref('post_locations/'+trackingId).off('value',_locListener); _locListener=null;}
  document.getElementById('app-content').innerHTML='<div class="loader"><div class="spinner"></div><p style="color:var(--sub)">Loading...</p></div>';
  let dS=false,dL=false,dC=false;
  const tryR=()=>{if(dS&&dL&&dC)render();};

  // sai_vouchers မှ ရှာ
  db.ref('sai_vouchers/'+id).once('value',s=>{
    if(s.exists()){saiData=s.val();dS=true;tryR();}
    else{
      // tracking/ path မှ ရှာ (KST_ format)
      db.ref('tracking/'+id).once('value',ts=>{
        if(ts.exists()){
          const td=ts.val();
          // tracking data ကို saiData အဖြစ် map ပြု
          saiData={
            sender_name: td.sender_name||td.from_name||null,
            recv_name:   td.recv_name||td.to_name||null,
            sender_phone:td.sender_phone||null,
            recv_phone:  td.recv_phone||null,
            dest:        td.dest||td.destination||null,
            amount:      td.amount||null,
            payment:     td.payment||null,
            date:        td.date||td.created_at||null,
            packing:     td.packing||null,
            weight:      td.weight||null,
            qty:         td.qty||null,
            direction:   td.direction||'TH',
            remark:      td.remark||td.note||null,
            status:      td.status||null,
          };
        } else { saiData=null; }
        dS=true; tryR();
      });
    }
  });

  // post_locations — once() သုံး (on() က callback မလာနိုင်)
  db.ref('post_locations/'+id).once('value',s=>{
    locationData=s.exists()?s.val():null;
    dL=true; tryR();
    // Render ပြီးနောက် live update အတွက် on() ထပ်ထည့်
    _locListener=db.ref('post_locations/'+id).on('value',ls=>{
      locationData=ls.exists()?ls.val():null;
      if(document.getElementById('loc-live-card'))renderLocCard();
      if(leafletMap)updateDriverMarker();
    });
  }).catch(()=>{dL=true;tryR();});

  // comments
  db.ref('posts/'+id+'/comments').once('value',s=>{
    commentsData=[];
    if(s.exists())s.forEach(c=>commentsData.push({key:c.key,...c.val()}));
    commentsData.sort((a,b)=>(a.time||0)-(b.time||0));
    dC=true;tryR();
  });

  // 8 second timeout fallback
  setTimeout(()=>{if(!dS||!dL||!dC){dS=true;dL=true;dC=true;tryR();}},8000);
}

function buildLocCard(curStep,curRoute,pct){
  const updAt=locationData?(locationData.updated_at||locationData.scan_time||null):null;
  const hasDriver=locationData&&locationData.driver_lat;
  return `<div class="loc-card" id="loc-live-card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div class="loc-pulse"></div><span style="font-size:12px;font-weight:600;color:var(--accent)">LIVE TRACKING</span></div><div class="loc-city-name" style="color:${curRoute.color}">${curRoute.label}</div><div class="loc-step-badge">Step ${curStep} / 12 &nbsp;•&nbsp; ${pct}%</div><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-labels"><span>BKK</span><span>မဲဆောက်</span><span>မြဝတီ</span><span>ဘားအံ</span><span>ပဲခူး</span><span>ရန်ကုန်</span><span>မန်လေး</span></div></div><div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap"><span class="status-badge ${curStep>=12?'s-done':'s-active'}">${curStep>=12?'✅ Delivered':'🚛 In Transit'}</span>${hasDriver?'<span class="status-badge s-active">📍 GPS Active</span>':''}</div>${updAt?`<div class="loc-update">🕐 Last scan: ${fmtDate(updAt)}</div>`:''}</div>`;
}
function renderLocCard(){
  const el=document.getElementById('loc-live-card'); if(!el)return;
  const s=locationData?(locationData.current_step||0):0;
  const r=ROUTE[Math.max(0,s-1)]||ROUTE[0];
  el.outerHTML=buildLocCard(s,r,Math.round((s/12)*100));
}

function buildCommentsSection(){

  commentsData.forEach(c=>{
    const ini=(c.name||c.sender_name||'?').substring(0,2).toUpperCase();
    const loc=c.location||c.step_label||c.city||null;
    html+=`<div class="comment-item"><div class="comment-avatar">${ini}</div><div class="comment-bubble"><div class="comment-name">${c.name||c.sender_name||'User'}</div><div class="comment-text">${c.message||c.text||''}</div>${loc?`<div class="comment-location">📍 ${loc}</div>`:''}<div class="comment-time-small">${c.time?fmtDate(c.time):''}</div></div></div>`;

}

function initMap(){
  const el=document.getElementById('tracking-map'); if(!el)return;
  if(leafletMap){try{leafletMap.remove();}catch(e){}leafletMap=null;driverMarker=null;}
  const curStep=locationData?(locationData.current_step||0):0;
  leafletMap=L.map('tracking-map',{zoomControl:true,scrollWheelZoom:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:18}).addTo(leafletMap);
  const allC=ROUTE.map(r=>[r.lat,r.lng]);
  L.polyline(allC,{color:'#2A2A5A',weight:2,dashArray:'5,5',opacity:.6}).addTo(leafletMap);
  if(curStep>1){const dC=ROUTE.filter(r=>r.step<=curStep).map(r=>[r.lat,r.lng]);L.polyline(dC,{color:'#00E676',weight:3,opacity:.7}).addTo(leafletMap);}
  const cityD={};
  ROUTE.forEach(r=>{
    if(cityD[r.city])return; cityD[r.city]=true;
    const done=r.step<=curStep, active=r.step===curStep, sz=active?20:12;
    const icon=L.divIcon({html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${done||active?r.color:'#2A2A5A'};border:${active?3:2}px solid #fff;box-shadow:${active?'0 0 14px '+r.color+',0 0 6px #fff':'none'};transition:.3s"></div>`,className:'',iconAnchor:[sz/2,sz/2]});
    L.marker([r.lat,r.lng],{icon}).addTo(leafletMap).bindPopup(`<b style="color:#000">${r.city}</b><br><span style="font-size:11px">${done&&!active?'✅ Done':active?'🚛 Now':'⏳ Pending'}</span>`);
  });
  updateDriverMarker();
  leafletMap.fitBounds(L.latLngBounds(allC).pad(.15));
}
function updateDriverMarker(){
  if(!leafletMap||!locationData)return;
  const lat=locationData.driver_lat,lng=locationData.driver_lng; if(!lat||!lng)return;
  if(driverMarker){driverMarker.setLatLng([lat,lng]);return;}
  const icon=L.divIcon({html:`<div style="font-size:26px;filter:drop-shadow(0 0 8px #FFD600)">🚛</div>`,className:'',iconAnchor:[13,13]});
  driverMarker=L.marker([lat,lng],{icon,zIndexOffset:1000}).addTo(leafletMap);
  driverMarker.bindPopup(`<b style="color:#000">🚛 Driver တည်နေရာ</b>`);
  leafletMap.setView([lat,lng],10);
}
function renderTimeline(curStep){
  const container=document.getElementById('timeline-container'); if(!container)return;
  const tlog=locationData&&locationData.timeline?locationData.timeline:{};
  container.innerHTML='';
  ROUTE.forEach(r=>{
    const done=r.step<curStep, active=r.step===curStep, cls=done?'done':active?'active':'pending';
    const entry=tlog[r.step]||tlog['step_'+r.step]||null;
    const div=document.createElement('div'); div.className='tl-item';
    div.innerHTML=`<div class="tl-dot ${cls}" style="${done||active?'background:'+r.color+';color:#000':''}">${done?'✓':active?'▶':r.step}</div><div class="tl-content ${cls}" style="${active?'border-left-color:'+r.color:''}"><div class="tl-label" style="color:${done||active?r.color:'var(--sub)'}">${r.label}</div>${entry&&entry.time?`<div class="tl-time">🕐 ${entry.time}</div>`:''}${entry&&entry.scanner?`<div class="tl-time">👤 ${entry.scanner}</div>`:''}<div class="tl-status" style="color:${done?'var(--accent)':active?r.color:'var(--sub)'}">${done?'✅ Done':active?'🚛 In this location':'⏳ Pending'}</div></div>`;
    container.appendChild(div);
  });
}
function drawVoucherQr(){
  const el=document.getElementById('voucher-qr'); if(!el)return;
  el.innerHTML='';
  try{new QRCode(el,{text:'https://chai1548.github.io/Tracking/?id='+trackingId,width:120,height:120,colorDark:'#1A3A7A',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.M});}
  catch(e){el.textContent=trackingId;}
}

let ptTrackingId=null, ptPostKey=null, ptTrackingData={}, ptPostData={};
let ptCurrentRating=0, ptSelectedFiles=[], ptCurrentUserId='user_'+Math.random().toString(36).substr(2,9);
let lbImages=[], lbIndex=0;

function ptDoSearch(){
  const v=document.getElementById('pt-search-input').value.trim();
  if(!v)return showToast('Tracking ID ထည့်ပါ');
  ptTrackingId=v; ptLoadData(v);
}

function ptLoadData(id){
  document.getElementById('pt-app-content').innerHTML='<div class="loader"><div class="spinner"></div><p style="color:var(--sub)">Loading...</p></div>';
  db.ref('tracking/'+id).once('value',snap=>{
    if(!snap.exists()){
      document.getElementById('pt-app-content').innerHTML=`<div class="card" style="text-align:center;padding:40px">
        <div style="font-size:50px;margin-bottom:12px">🔍</div>
        <p style="color:var(--sub)">Post Tracking ID မတွေ့ပါ</p>
        <p style="color:var(--accent);font-weight:700;margin-top:6px">${id}</p>
        <p style="color:var(--sub);font-size:12px;margin-top:8px">Format: KST_1780553303807</p>
      </div>`;
      return;
    }
    ptTrackingData=snap.val();
    ptPostKey=ptTrackingData.post_key||null;

    // post_key ရှိမရှိ မသိသေး — render ဦးစွာ ပြမည်
    const doRender=(pData)=>{
      ptPostData=pData||{};
      ptRenderAll(id);
      ptLoadComments(ptPostKey);
      ptLoadAdminFeedback(id);
      ptLoadImages(id);
      ptLoadFeedbacks(id);
      ptUpdateTracking(id);
    };

    if(ptPostKey){
      db.ref('posts/'+ptPostKey).once('value',ps=>{
        doRender(ps.exists()?ps.val():null);
      }).catch(()=>doRender(null));
    } else {
      // post_key မရှိ — tracking data ကိုပဲ ပြမည်
      doRender(null);
    }
  }).catch(e=>{
    document.getElementById('pt-app-content').innerHTML=`<div class="card" style="text-align:center;padding:40px"><p style="color:var(--red)">Error: ${e.message}</p></div>`;
  });
}

function ptRenderAll(id){
  const d=ptTrackingData, post=ptPostData;
  let html='';

  // ── POST MEDIA (Swiper carousel) ──
  if(post&&(post.data||post.video_url||post.description)){
    html+=`<div class="pt-section"><div class="card-title">📄 Post Content</div>`;
    const mediaItems=[];
    if(post.video_url&&post.video_url!=='null')mediaItems.push({type:'video',url:post.video_url});
    if(post.data&&post.data!=='null'){
      let imgs=[];
      try{imgs=JSON.parse(post.data);if(!Array.isArray(imgs))imgs=[post.data];}catch(e){imgs=[post.data];}
      imgs.forEach(u=>{
        if(u.includes('.mp4')||u.includes('.webm')||u.toLowerCase().includes('video'))mediaItems.push({type:'video',url:u});
        else mediaItems.push({type:'image',url:u});
      });
    }
    window._ptMediaItems=mediaItems;
    if(mediaItems.length>0){
      html+=`<div class="swiper pt-swiper" id="ptSwiper"><div class="swiper-wrapper">`;
      mediaItems.forEach((m,i)=>{
        html+=`<div class="swiper-slide">`;
        if(m.type==='video')html+=`<video controls playsinline style="max-width:100%;max-height:100%"><source src="${m.url}" type="video/mp4"></video>`;
        else html+=`<img src="${m.url}" onclick="lbOpen(${i},'pt')" style="cursor:pointer" loading="lazy">`;
        html+=`</div>`;
      });
      html+=`</div>`;
      if(mediaItems.length>1)html+=`<div class="swiper-pagination"></div><div class="swiper-button-prev"></div><div class="swiper-button-next"></div>`;
      html+=`</div>`;
      if(mediaItems.length>1){
        const imgC=mediaItems.filter(x=>x.type==='image').length;
        const vidC=mediaItems.filter(x=>x.type==='video').length;
        const parts=[];
        if(imgC)parts.push(`📷 ${imgC} Photo${imgC>1?'s':''}`);
        if(vidC)parts.push(`🎥 ${vidC} Video${vidC>1?'s':''}`);
        html+=`<div style="text-align:center;font-size:12px;color:var(--sub);padding:6px 0">${parts.join(' • ')}</div>`;
      }
    }
    if(post.description)html+=`<div style="padding:10px;font-size:13px;line-height:1.6;color:var(--text);background:var(--card2);border-radius:10px;margin-top:8px">${post.description}</div>`;
    const lk=post.likes?Object.keys(post.likes).length:0;
    const cm=post.comments?Object.keys(post.comments).length:0;
    html+=`<div class="pt-post-stats"><div>❤️ <span class="post-likes-count">${lk}</span> Likes</div><div>💬 <span class="post-comments-count">${cm}</span> Comments</div></div>`;
    html+=`</div>`;
  }

  // ── TRACKING INFO (with real-time classes + QR) ──
  html+=`<div class="pt-section" style="background:linear-gradient(135deg,#0d1a2e,#1a1a3e);border-color:#1E3A5F">
    <div class="card-title">🚚 Tracking Information</div>
    <div class="pt-detail-grid">
      <div class="pt-detail-card"><div class="pt-detail-label">Tracking ID</div><div class="pt-detail-value" style="color:var(--accent);font-size:12px">${id}</div></div>
      <div class="pt-detail-card"><div class="pt-detail-label">Status</div><div class="pt-detail-value pt-status-val">${d.status||'Active'}</div></div>
      <div class="pt-detail-card"><div class="pt-detail-label">Views</div><div class="pt-detail-value pt-views-val">${d.views||0} 👁</div></div>
      <div class="pt-detail-card"><div class="pt-detail-label">Last Location</div><div class="pt-detail-value pt-loc-val" style="font-size:11px">${d.last_location||'Unknown'}</div></div>
    </div>
    ${d.tracking_url?`<div style="background:var(--card2);padding:12px;border-radius:10px;text-align:center;margin:10px 0"><p style="font-size:11px;color:var(--sub);margin-bottom:8px">Scan QR Code</p><div id="pt-qr-${id}" style="display:inline-block;background:#fff;padding:6px;border-radius:8px"></div></div>`:''}
    <div class="btn-row"><button class="btn btn-primary" onclick="ptShare()">📤 Share</button></div>
  </div>`;

  // ── PLACEHOLDERS ──
  html+=`<div id="pt-images-container"></div>`;
  if(ptPostKey)html+=`<div class="pt-section"><div class="card-title">💬 Comments</div><div id="pt-comments-list"><p style="color:var(--sub);font-size:13px">Loading...</p></div></div>`;
  html+=`<div class="pt-section"><div class="card-title">⭐ Customer Feedback</div><div id="pt-feedback-list"></div>
    <div style="margin-top:12px;background:var(--card2);padding:12px;border-radius:10px">
      <p style="font-size:12px;color:var(--sub);margin-bottom:8px">Leave Your Feedback</p>
      <div class="pt-star-row" id="pt-star-row">${[1,2,3,4,5].map(i=>`<span class="pt-star" onclick="ptSetRating(${i})">★</span>`).join('')}</div>
      <textarea class="feedback-textarea" id="pt-feedback-text" placeholder="Share your experience..."></textarea>
      <div class="btn-row"><button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" onclick="ptSubmitFeedback()">Submit Feedback</button></div>
    </div>
  </div>`;
  html+=`<div class="pt-section"><div class="card-title">📍 Location Updates</div><div id="pt-admin-list"><p style="color:var(--sub);font-size:13px;text-align:center;padding:14px">Loading...</p></div></div>`;
  if(d.image_upload_enabled!==false){
    html+=`<div class="pt-section"><div class="card-title">📸 Upload Images</div>
      <div class="pt-upload-section">
        <label class="file-input-label">📂 Choose Images / Videos
          <input type="file" multiple accept="image/*,video/*" style="display:none" onchange="ptHandleFiles(event)">
        </label>
        <div class="pt-img-preview" id="pt-preview"></div>
        <div class="btn-row" id="pt-upload-btn-wrap" style="display:none">
          <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="ptUpload()" id="pt-upload-btn">⬆️ Upload</button>
        </div>
      </div>
    </div>`;
  }

  document.getElementById('pt-app-content').innerHTML=html;

  // Init Swiper
  setTimeout(()=>{
    const s=document.getElementById('ptSwiper');
    if(s)new Swiper('#ptSwiper',{
      slidesPerView:1,
      pagination:{el:'.swiper-pagination',clickable:true},
      navigation:{nextEl:'.swiper-button-next',prevEl:'.swiper-button-prev'},
      keyboard:{enabled:true},
      on:{slideChange(){document.querySelectorAll('#ptSwiper video').forEach(v=>v.pause());}}
    });
    // QR code
    if(d.tracking_url){
      const qrEl=document.getElementById('pt-qr-'+id);
      if(qrEl)try{new QRCode(qrEl,{text:d.tracking_url,width:140,height:140});}catch(e){}
    }
  },100);

  // Real-time tracking updates
  db.ref('tracking/'+id).on('value',snap=>{
    if(!snap.exists())return;
    const td=snap.val();
    const sv=document.querySelector('.pt-status-val');
    const vv=document.querySelector('.pt-views-val');
    const lv=document.querySelector('.pt-loc-val');
    const lc=document.querySelector('.post-likes-count');
    const cc=document.querySelector('.post-comments-count');
    if(sv)sv.textContent=td.status||'Active';
    if(vv)vv.textContent=(td.views||0)+' 👁';
    if(lv)lv.textContent=td.last_location||'Unknown';
  });
  if(ptPostKey){
    db.ref('posts/'+ptPostKey).on('value',snap=>{
      if(!snap.exists())return;
      const pd=snap.val();
      const lc=document.querySelector('.post-likes-count');
      const cc=document.querySelector('.post-comments-count');
      if(lc&&pd.likes)lc.textContent=Object.keys(pd.likes).length;
      if(cc&&pd.comments)cc.textContent=Object.keys(pd.comments).length;
    });
  }
}

function ptLoadComments(postKey){
  db.ref('posts/'+postKey+'/comments').on('value',snap=>{
    const c=document.getElementById('pt-comments-list'); if(!c)return;
    if(!snap.exists()){c.innerHTML='<p style="color:var(--sub);font-size:13px">No comments yet</p>';return;}
    const arr=[];snap.forEach(ch=>arr.push({key:ch.key,...ch.val()}));
    arr.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
    c.innerHTML=arr.map(cm=>{
      const ini=(cm.username||'?').charAt(0).toUpperCase();
      const av=cm.profile_img?`<div class="pt-comment-avatar"><img src="${cm.profile_img}"></div>`:`<div class="pt-comment-avatar">${ini}</div>`;

    }).join('');
  });
}

function ptSetRating(r){ptCurrentRating=r;document.querySelectorAll('.pt-star').forEach((s,i)=>s.classList.toggle('active',i<r));}
function ptSubmitFeedback(){

  if(!text)return showToast('Feedback ရေးပါ');
  db.ref('feedbacks/'+ptTrackingId).push({rating:ptCurrentRating,text,user_id:ptCurrentUserId,created_at:firebase.database.ServerValue.TIMESTAMP})
    .then(()=>{document.getElementById('pt-feedback-text').value='';ptSetRating(0);showToast('✅ Feedback တင်ပြီး');});
}
function ptHandleFiles(e){
  ptSelectedFiles=Array.from(e.target.files);
  const prev=document.getElementById('pt-preview');
  const wrap=document.getElementById('pt-upload-btn-wrap');
  if(!prev)return;
  prev.innerHTML='';
  ptSelectedFiles.forEach((f,i)=>{
    const r=new FileReader();
    r.onload=ev=>{
      const d=document.createElement('div'); d.className='pt-preview-item';
      const isV=f.type.startsWith('video/');
      d.innerHTML=isV?`<video src="${ev.target.result}" muted></video><button class="pt-preview-remove" onclick="ptRemoveFile(${i})">×</button>`:`<img src="${ev.target.result}"><button class="pt-preview-remove" onclick="ptRemoveFile(${i})">×</button>`;
      prev.appendChild(d);
    };
    r.readAsDataURL(f);
  });
  if(wrap)wrap.style.display=ptSelectedFiles.length?'flex':'none';
  const btn=document.getElementById('pt-upload-btn');
  if(btn)btn.textContent=`⬆️ Upload ${ptSelectedFiles.length} File(s)`;
}
function ptRemoveFile(i){ptSelectedFiles.splice(i,1);const e={target:{files:ptSelectedFiles}};ptHandleFiles(e);}
function ptUpload(){
  if(!ptSelectedFiles.length)return showToast('File ရွေးပါ');
  const btn=document.getElementById('pt-upload-btn');
  if(btn){btn.disabled=true;btn.textContent='Uploading...';}
  let done=0;
  ptSelectedFiles.forEach(f=>{
    const ts=Date.now();
    const ref=storage.ref('tracking_images/'+ptTrackingId+'_'+ts+'_'+f.name);
    ref.put(f).then(s=>s.ref.getDownloadURL()).then(url=>{
      return db.ref('tracking_images/'+ptTrackingId).push({url,name:f.name,type:f.type,uploaded_by:ptCurrentUserId,uploaded_at:firebase.database.ServerValue.TIMESTAMP});
    }).then(()=>{
      done++;
      if(done===ptSelectedFiles.length){
        ptSelectedFiles=[];
        document.getElementById('pt-preview').innerHTML='';
        const w=document.getElementById('pt-upload-btn-wrap');if(w)w.style.display='none';
        if(btn){btn.disabled=false;btn.textContent='⬆️ Upload';}
        showToast('✅ Upload ပြီး');
      }
    }).catch(e=>showToast('Upload error: '+e.message));
  });
}
function ptUpdateTracking(id){
  const upd={views:firebase.database.ServerValue.increment(1),last_scan_at:firebase.database.ServerValue.TIMESTAMP};
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>{upd.last_location=p.coords.latitude.toFixed(4)+','+p.coords.longitude.toFixed(4);db.ref('tracking/'+id).update(upd);},()=>{db.ref('tracking/'+id).update(upd);});
  }else{db.ref('tracking/'+id).update(upd);}
}
function ptShare(){
  const url=location.href;
  if(navigator.share)navigator.share({title:'Post Tracking',url});
  else{navigator.clipboard.writeText(url);showToast('🔗 Link ကူးပြီး');}
}
function ptFmtDate(d){return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}

// ════════════════════════════════════════════
// LIGHTBOX (shared)
// ════════════════════════════════════════════
function lbOpen(index, source){
  let items=[];
  if(source==='pt')items=(window._ptMediaItems||[]);
  else if(source==='gallery')items=(window._ptGalleryImages||[]).map(i=>({type:i.type&&i.type.startsWith('video/')?'video':'image',url:i.url}));
  if(!items.length)return;
  lbImages=items; lbIndex=index;
  lbShow();
  document.getElementById('lbModal').classList.add('active');
  document.addEventListener('keydown',lbKey);
}
function lbShow(){
  const m=lbImages[lbIndex];
  const img=document.getElementById('lbImg'), vid=document.getElementById('lbVideo');
  if(m.type==='video'){img.style.display='none';vid.style.display='block';vid.querySelector('source').src=m.url;vid.load();vid.play();}
  else{vid.style.display='none';img.style.display='block';img.src=m.url;}
  const c=document.getElementById('lbCounter');
  c.style.display=lbImages.length>1?'block':'none';
  c.textContent=(lbIndex+1)+' / '+lbImages.length;
  document.getElementById('lbPrev').style.display=lbImages.length>1?'block':'none';
  document.getElementById('lbNext').style.display=lbImages.length>1?'block':'none';
}
function lbNav(d){
  lbIndex=(lbIndex+d+lbImages.length)%lbImages.length; lbShow();
}
function lbClose(){
  document.getElementById('lbModal').classList.remove('active');
  const v=document.getElementById('lbVideo'); if(!v.paused)v.pause();
  document.removeEventListener('keydown',lbKey);
}
function lbKey(e){if(e.key==='ArrowLeft')lbNav(-1);else if(e.key==='ArrowRight')lbNav(1);else if(e.key==='Escape')lbClose();}
function lbSave(){
  const url=lbImages[lbIndex]&&lbImages[lbIndex].url;
  if(!url)return;
  fetch(url).then(r=>r.blob()).then(b=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='image_'+Date.now()+'.jpg';a.click();
  }).catch(()=>window.open(url,'_blank'));
}

// ════════════════════════════════════════════
// SHARED UTILS
// ════════════════════════════════════════════
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
function fmtDate(v){
  try{const d=typeof v==='number'?new Date(v):new Date(v);return d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return v||'';}
}
