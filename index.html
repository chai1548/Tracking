<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Tracking System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2d3748;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #718096;
            font-size: 14px;
        }
        
        .tracking-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        .status-card {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #48bb78;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }
        
        .status-item:last-child {
            margin-bottom: 0;
        }
        
        .status-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 20px;
        }
        
        .status-icon.active {
            background: #c6f6d5;
        }
        
        .status-icon.location {
            background: #feebc8;
        }
        
        .status-icon.time {
            background: #bee3f8;
        }
        
        .status-icon.views {
            background: #e9d8fd;
        }
        
        .status-content {
            flex: 1;
        }
        
        .status-label {
            font-size: 12px;
            color: #718096;
            margin-bottom: 4px;
        }
        
        .status-value {
            font-size: 16px;
            color: #2d3748;
            font-weight: 600;
        }
        
        /* Owner Controls */
        .owner-controls {
            background: #fff5f5;
            border: 2px solid #fc8181;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .owner-controls h3 {
            color: #c53030;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .toggle-section {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .toggle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background: #cbd5e0;
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .toggle-switch.active {
            background: #48bb78;
        }
        
        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        
        .toggle-switch.active .toggle-slider {
            transform: translateX(24px);
        }
        
        .location-note-form {
            margin-top: 10px;
        }
        
        .location-note-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            resize: vertical;
            min-height: 60px;
        }
        
        .location-note-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        /* Location Notes Display */
        .location-notes {
            background: #fffaf0;
            border-left: 4px solid #ed8936;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .location-notes h4 {
            color: #c05621;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .location-note-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        
        .location-note-item:last-child {
            margin-bottom: 0;
        }
        
        .location-note-text {
            color: #2d3748;
            font-size: 14px;
            margin-bottom: 6px;
        }
        
        .location-note-time {
            color: #718096;
            font-size: 12px;
        }
        
        /* Image Gallery */
        .image-gallery {
            margin-bottom: 20px;
        }
        
        .image-gallery h3 {
            color: #2d3748;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }
        
        .image-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .image-item:hover {
            transform: scale(1.05);
        }
        
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .image-upload-section {
            background: #f7fafc;
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .image-upload-section:hover {
            border-color: #667eea;
            background: #edf2f7;
        }
        
        .image-upload-section.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .image-preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .preview-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .preview-remove {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #f56565;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
        }
        
        /* Feedback Section */
        .feedback-section {
            background: #f0fff4;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .feedback-section h3 {
            color: #22543d;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .feedback-form {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .rating-input {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            font-size: 28px;
        }
        
        .star {
            cursor: pointer;
            color: #cbd5e0;
            transition: color 0.2s;
        }
        
        .star.active {
            color: #fbbf24;
        }
        
        .feedback-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
        }
        
        .feedback-input:focus {
            outline: none;
            border-color: #48bb78;
        }
        
        .feedback-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .feedback-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #48bb78;
        }
        
        .feedback-item:last-child {
            margin-bottom: 0;
        }
        
        .feedback-rating {
            color: #fbbf24;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .feedback-text {
            color: #2d3748;
            font-size: 14px;
            margin-bottom: 8px;
            line-height: 1.5;
        }
        
        .feedback-meta {
            color: #718096;
            font-size: 12px;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
        }
        
        .btn-upload {
            background: #48bb78;
            color: white;
        }
        
        .btn-upload:hover {
            background: #38a169;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #f56565;
            color: white;
        }
        
        .btn-danger:hover {
            background: #e53e3e;
        }
        
        .btn-small {
            padding: 8px 12px;
            font-size: 14px;
            width: auto;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .success {
            background: #c6f6d5;
            color: #22543d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        /* Image Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .qr-section {
            text-align: center;
            padding: 20px;
            background: #f7fafc;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .qr-section h3 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        #qr-reader {
            border-radius: 8px;
            overflow: hidden;
            margin: 0 auto;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="tracking-icon">📦</div>
            <h1>Post Tracking</h1>
            <p>Track your order in real-time</p>
        </div>
        
        <div id="app-content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading...</p>
            </div>
        </div>
    </div>
    
    <!-- Image Modal -->
    <div id="imageModal" class="modal">
        <span class="modal-close" onclick="closeImageModal()">&times;</span>
        <img id="modalImage" class="modal-content" src="" alt="Full size image">
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <!-- QR Code Libraries -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <script>
        // Firebase Configuration
const firebaseConfig = {
            apiKey: "AIzaSyB49vRPX8YaWuTP5GS3lsBDqdAaz_hJYAw",
            authDomain: "onlineshop-849c8.firebaseapp.com",
            databaseURL: "https://onlineshop-849c8.firebaseio.com",
            projectId: "onlineshop-849c8",
            storageBucket: "onlineshop-849c8.appspot.com",
            messagingSenderId: "883512833370",
            appId: "1:883512833370:android:185171fa84296e0dafef63"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const storage = firebase.storage();
        const auth = firebase.auth();
        
        let trackingId = null;
        let html5QrCode = null;
        let selectedFiles = [];
        let currentRating = 0;
        let isOwner = false;
        let currentUserId = null;
        let postData = null;
        
        // Initialize
        window.onload = function() {
            auth.signInAnonymously().then(() => {
                currentUserId = auth.currentUser.uid;
                
                const urlParams = new URLSearchParams(window.location.search);
                trackingId = urlParams.get('id');
                
                if (trackingId) {
                    loadTrackingData(trackingId);
                } else {
                    showQRScanner();
                }
            });
        };
        
        function loadTrackingData(id) {
            const trackingRef = database.ref('tracking/' + id);
            
            trackingRef.once('value', (snapshot) => {
                if (snapshot.exists()) {
                    postData = snapshot.val();
                    isOwner = (currentUserId === postData.owner_uid);
                    displayTrackingInfo(postData);
                    updateTracking(id);
                    loadLocationNotes(id);
                    loadImages(id);
                    loadFeedbacks(id);
                    
                    // Real-time updates
                    trackingRef.on('value', (snap) => {
                        if (snap.exists()) {
                            postData = snap.val();
                            displayTrackingInfo(snap.val());
                        }
                    });
                } else {
                    showError('Tracking ID မတွေ့ပါ / Tracking ID not found');
                    setTimeout(() => showQRScanner(), 2000);
                }
            });
        }
        
        function displayTrackingInfo(data) {
            const content = `
                <div class="status-card">
                    <div class="status-item">
                        <div class="status-icon active">✓</div>
                        <div class="status-content">
                            <div class="status-label">Status / အခြေအနေ</div>
                            <div class="status-value">${data.status || 'Active'}</div>
                        </div>
                    </div>
                    
                    <div class="status-item">
                        <div class="status-icon location">📍</div>
                        <div class="status-content">
                            <div class="status-label">Last Location / နောက်ဆုံးနေရာ</div>
                            <div class="status-value">${data.last_location || 'Not available'}</div>
                        </div>
                    </div>
                    
                    <div class="status-item">
                        <div class="status-icon time">⏰</div>
                        <div class="status-content">
                            <div class="status-label">Last Updated / နောက်ဆုံးအပ်ဒိတ်</div>
                            <div class="status-value">${data.last_scan_at ? formatDate(new Date(data.last_scan_at)) : 'Never'}</div>
                        </div>
                    </div>
                    
                    <div class="status-item">
                        <div class="status-icon views">👁️</div>
                            <div class="status-content">
                            <div class="status-label">Views / ကြည့်သူဦးရေ</div>
                            <div class="status-value">${data.views || 0} times</div>
                        </div>
                    </div>
                </div>
                
                <!-- Location Notes -->
                <div id="location-notes-container"></div>
                
                <!-- Owner Controls -->
                ${isOwner ? `
                    <div class="owner-controls">
                        <h3>👨‍💼 Owner Controls</h3>
                        
                        <!-- Image Upload Toggle -->
                        <div class="toggle-section">
                            <div class="toggle-header">
                                <span>🖼️ Image Upload</span>
                                <div class="toggle-switch ${data.image_upload_enabled !== false ? 'active' : ''}" 
                                     onclick="toggleImageUpload()">
                                    <div class="toggle-slider"></div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Location Note Form -->
                        <div class="location-note-form">
                            <h4 style="margin-bottom: 10px; color: #2d3748;">📍 Send Location Note</h4>
                            <textarea id="location-note-input" 
                                      class="location-note-input" 
                                      placeholder="ပစ္စည်းရောက်ရှိနေရာ / Location note..."></textarea>
                            <button class="btn btn-success btn-small" onclick="sendLocationNote()">
                                📤 Send Note
                            </button>
                        </div>
                        
                        <!-- Status Update -->
                        <button class="btn btn-primary" onclick="updateStatus()">
                            🔄 Update Status
                        </button>
                    </div>
                ` : ''}
                
                <!-- Image Gallery -->
                <div id="image-gallery-container"></div>
                
                <!-- Image Upload (for users if enabled) -->
                ${!isOwner && data.image_upload_enabled !== false ? `
                    <div class="image-upload-section" onclick="document.getElementById('file-input').click()">
                        <p style="margin-bottom: 10px; font-weight: 600; color: #2d3748;">📸 Upload Photos</p>
                        <p style="font-size: 14px; color: #718096;">Click to select images</p>
                        <input type="file" id="file-input" accept="image/*" multiple style="display: none;" 
                               onchange="handleFileSelect(event)">
                    </div>
                    <div id="imagePreview" class="image-preview"></div>
                    <button class="btn btn-upload ${selectedFiles.length === 0 ? 'hidden' : ''}" 
                            id="upload-btn" onclick="uploadImages()">
                        ⬆️ Upload ${selectedFiles.length} Image(s)
                    </button>
                ` : ''}
                
                <!-- Feedback Section -->
                <div class="feedback-section">
                    <h3>💬 User Feedback</h3>
                    
                    <div class="feedback-form">
                        <div class="rating-input" id="rating-stars">
                            ${[1, 2, 3, 4, 5].map(i => 
                                `<span class="star" data-rating="${i}" onclick="setRating(${i})">★</span>`
                            ).join('')}
                        </div>
                        <textarea id="feedback-text" class="feedback-input" 
                                  placeholder="Share your experience..."></textarea>
                        <button class="btn btn-success btn-small" onclick="submitFeedback()">
                            📝 Submit Feedback
                        </button>
                    </div>
                    
                    <div id="feedback-list" class="feedback-list"></div>
                </div>
                
                <button class="btn btn-primary" onclick="shareTracking()">
                    🔗 Share Tracking Link
                </button>
                
                <button class="btn btn-secondary" onclick="showQRScanner()">
                    🔍 Scan New QR Code
                </button>
            `;
            
            document.getElementById('app-content').innerHTML = content;
        }
        
        function loadLocationNotes(id) {
            const notesRef = database.ref('location_notes/' + id);
            
            notesRef.on('value', (snapshot) => {
                const container = document.getElementById('location-notes-container');
                if (!container) return;
                
                if (snapshot.exists()) {
                    let notesHTML = '<div class="location-notes"><h4>📍 Location Updates</h4>';
                    
                    const notes = [];
                    snapshot.forEach((child) => {
                        notes.push({ key: child.key, ...child.val() });
                    });
                    
                    // Sort by timestamp (newest first)
                    notes.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    
                    notes.forEach(note => {
                        notesHTML += `
                            <div class="location-note-item">
                                <div class="location-note-text">${note.text}</div>
                                <div class="location-note-time">
                                    ${note.timestamp ? formatDate(new Date(note.timestamp)) : 'Just now'}
                                </div>
                            </div>
                        `;
                    });
                    
                    notesHTML += '</div>';
                    container.innerHTML = notesHTML;
                } else {
                    container.innerHTML = '';
                }
            });
        }
        
        function sendLocationNote() {
            const noteInput = document.getElementById('location-note-input');
            const noteText = noteInput.value.trim();
            
            if (!noteText) {
                showError('Please enter a location note');
                return;
            }
            
            const noteData = {
                text: noteText,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                sender_id: currentUserId
            };
            
            database.ref('location_notes/' + trackingId).push(noteData)
                .then(() => {
                    noteInput.value = '';
                    showSuccess('Location note sent!');
                })
                .catch((error) => {
                    showError('Failed to send note: ' + error.message);
                });
        }
        
        function toggleImageUpload() {
            const newState = postData.image_upload_enabled === false;
            
            database.ref('tracking/' + trackingId).update({
                image_upload_enabled: newState
            }).then(() => {
                showSuccess(`Image upload ${newState ? 'enabled' : 'disabled'}`);
            });
        }
        
        function loadImages(id) {
            const imagesRef = database.ref('tracking_images/' + id);
            
            imagesRef.on('value', (snapshot) => {
                const container = document.getElementById('image-gallery-container');
                if (!container) return;
                
                if (snapshot.exists()) {
                    let imagesHTML = '<div class="image-gallery"><h3>🖼️ Photos</h3><div class="image-grid">';
                    
                    snapshot.forEach((child) => {
                        const imageData = child.val();
                        imagesHTML += `
                            <div class="image-item" onclick="openImageModal('${imageData.url}')">
                                <img src="${imageData.url}" alt="${imageData.name || 'Image'}">
                            </div>
                        `;
                    });
                    
                    imagesHTML += '</div></div>';
                    container.innerHTML = imagesHTML;
                } else {
                    container.innerHTML = '';
                }
            });
        }
        
        function openImageModal(url) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modal.classList.add('active');
            modalImg.src = url;
        }
        
        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
        }
        
        function handleFileSelect(event) {
            selectedFiles = Array.from(event.target.files);
            displayImagePreviews();
            document.getElementById('upload-btn').classList.remove('hidden');
        }
        
        function displayImagePreviews() {
            const previewContainer = document.getElementById('imagePreview');
            previewContainer.innerHTML = '';
            
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    previewItem.innerHTML = `
                        <img src="${e.target.result}" alt="Preview">
                        <button class="preview-remove" onclick="removePreview(${index})">×</button>
                    `;
                    previewContainer.appendChild(previewItem);
                };
                reader.readAsDataURL(file);
            });
        }
        
        function removePreview(index) {
            selectedFiles.splice(index, 1);
            displayImagePreviews();
            
            if (selectedFiles.length === 0) {
                document.getElementById('upload-btn').classList.add('hidden');
            } else {
                document.getElementById('upload-btn').textContent = `⬆️ Upload ${selectedFiles.length} Image(s)`;
            }
        }
        
        function uploadImages() {
            if (selectedFiles.length === 0) return;
            
            const uploadBtn = document.getElementById('upload-btn');
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';
            
            let uploadCount = 0;
            
            selectedFiles.forEach((file) => {
                const storageRef = storage.ref('tracking_images/' + trackingId + '/' + Date.now() + '_' + file.name);
                const uploadTask = storageRef.put(file);
                
                uploadTask.then((snapshot) => {
                    return snapshot.ref.getDownloadURL();
                }).then((downloadURL) => {
                    const imageData = {
                        url: downloadURL,
                        name: file.name,
                        uploaded_by: currentUserId,
                        uploaded_at: firebase.database.ServerValue.TIMESTAMP
                    };
                    
                    return database.ref('tracking_images/' + trackingId).push(imageData);
                }).then(() => {
                    uploadCount++;
                    
                    if (uploadCount === selectedFiles.length) {
                        selectedFiles = [];
                        document.getElementById('imagePreview').innerHTML = '';
                        uploadBtn.classList.add('hidden');
                        uploadBtn.disabled = false;
                        uploadBtn.textContent = '⬆️ Upload Images';
                        showSuccess('Images uploaded successfully!');
                    }
                }).catch((error) => {
                    showError('Upload failed: ' + error.message);
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = `⬆️ Upload ${selectedFiles.length} Image(s)`;
                });
            });
        }
        
        function setRating(rating) {
            currentRating = rating;
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }
        
        function submitFeedback() {
            const feedbackText = document.getElementById('feedback-text').value.trim();
            
            if (currentRating === 0) {
                showError('Please select a rating');
                return;
            }
            
            if (!feedbackText) {
                showError('Please enter your feedback');
                return;
            }
            
            const feedbackData = {
                rating: currentRating,
                text: feedbackText,
                user_id: currentUserId,
                created_at: firebase.database.ServerValue.TIMESTAMP
            };
            
            database.ref('feedbacks/' + trackingId).push(feedbackData)
                .then(() => {
                    document.getElementById('feedback-text').value = '';
                    setRating(0);
                    showSuccess('Feedback submitted! Thank you!');
                })
                .catch((error) => {
                    showError('Failed to submit feedback: ' + error.message);
                });
        }
        
        function loadFeedbacks(id) {
            const feedbacksRef = database.ref('feedbacks/' + id);
            
            feedbacksRef.on('value', (snapshot) => {
                const container = document.getElementById('feedback-list');
                if (!container) return;
                
                container.innerHTML = '';
                
                if (snapshot.exists()) {
                    const feedbacks = [];
                    snapshot.forEach((child) => {
                        feedbacks.push({ key: child.key, ...child.val() });
                    });
                    
                    // Sort by timestamp (newest first)
                    feedbacks.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
                    
                    feedbacks.forEach(feedback => {
                        const feedbackItem = document.createElement('div');
                        feedbackItem.className = 'feedback-item';
                        
                        const stars = '★'.repeat(feedback.rating) + '☆'.repeat(5 - feedback.rating);
                        
                        feedbackItem.innerHTML = `
                            <div class="feedback-rating">${stars}</div>
                            <div class="feedback-text">${feedback.text}</div>
                            <div class="feedback-meta">
                                ${feedback.created_at ? formatDate(new Date(feedback.created_at)) : 'Just now'}
                            </div>
                        `;
                        
                        container.appendChild(feedbackItem);
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center; color: #718096; padding: 20px;">No feedback yet</p>';
                }
            });
        }
        
        function updateTracking(id) {
            const updates = {
                views: firebase.database.ServerValue.increment(1),
                last_scan_at: firebase.database.ServerValue.TIMESTAMP
            };
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        updates.last_location = `${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`;
                        database.ref('tracking/' + id).update(updates);
                    },
                    () => {
                        updates.last_location = 'Location unavailable';
                        database.ref('tracking/' + id).update(updates);
                    }
                );
            } else {
                database.ref('tracking/' + id).update(updates);
            }
        }
        
        function updateStatus() {
            const newStatus = prompt('Enter new status:', postData.status || 'Active');
            if (newStatus) {
                database.ref('tracking/' + trackingId).update({
                    status: newStatus,
                    last_scan_at: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    showSuccess('Status updated!');
                });
            }
        }
        
        function showQRScanner() {
            const content = `
                <div class="qr-section">
                    <h3>🔍 QR Code Scan လုပ်ပါ</h3>
                    
                    <div class="scan-options">
                        <button class="btn btn-primary" onclick="startCameraScanner()">
                            📹 Camera Scan
                        </button>
                        <button class="btn btn-upload" onclick="document.getElementById('qr-image-input').click()">
                            🖼️ Upload QR Image
                        </button>
                    </div>
                    
                    <div id="qr-reader" style="display:none;"></div>
                    
                    <div class="qr-upload-section">
                        <input type="file" id="qr-image-input" accept="image/*" style="display:none;" 
                               onchange="handleQRImageUpload(event)">
                        <img id="qr-image-preview" alt="QR Preview" style="display:none; max-width: 100%; margin-top: 10px;">
                        <div id="qr-scan-result"></div>
                    </div>
                </div>
                
                <button class="btn btn-secondary" onclick="enterManually()">
                    ⌨️ Tracking ID ရိုက်ထည့်မည်
                </button>
            `;
            
            document.getElementById('app-content').innerHTML = content;
        }
        
        function startCameraScanner() {
            const qrReaderDiv = document.getElementById('qr-reader');
            qrReaderDiv.style.display = 'block';
            
            html5QrCode = new Html5Qrcode("qr-reader");
            
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    html5QrCode.stop().then(() => {
                        processQRCode(decodedText);
                    });
                },
                (errorMessage) => {
                    // Ignore continuous scanning errors
                }
            ).catch(err => {
                showError('Camera access မရပါ။ QR ပုံ upload လုပ်ပါ။');
            });
        }
        
        function handleQRImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('qr-image-preview');
                img.src = e.target.result;
                img.style.display = 'block';
                
                const image = new Image();
                image.src = e.target.result;
                
                image.onload = () => {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = image.width;
                    canvas.height = image.height;
                    context.drawImage(image, 0, 0);
                    
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    
                    const resultDiv = document.getElementById('qr-scan-result');
                    
                    if (code) {
                        resultDiv.innerHTML = '<div class="success">✓ QR Code ဖတ်ပြီးပါပြီ!</div>';
                        setTimeout(() => {
                            processQRCode(code.data);
                        }, 500);
                    } else {
                        resultDiv.innerHTML = '<div class="error">❌ QR Code မတွေ့ပါ။ ထပ်စမ်းကြည့်ပါ။</div>';
                    }
                };
            };
            reader.readAsDataURL(file);
        }
        
        function processQRCode(decodedText) {
            try {
                const url = new URL(decodedText);
                const id = url.searchParams.get('id');
                if (id) {
                    trackingId = id;
                    window.location.search = '?id=' + id;
                } else {
                    trackingId = decodedText;
                    window.location.search = '?id=' + decodedText;
                }
            } catch (e) {
                trackingId = decodedText;
                window.location.search = '?id=' + decodedText;
            }
        }
        
        function enterManually() {
            const id = prompt('Tracking ID ထည့်ပါ / Enter Tracking ID:');
            if (id) {
                trackingId = id;
                window.location.search = '?id=' + id;
            }
        }
        
        function shareTracking() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: 'Track Your Order',
                    text: 'View tracking information',
                    url: url
                }).catch(err => {
                    copyToClipboard(url);
                });
            } else {
                copyToClipboard(url);
            }
        }
        
        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showSuccess('Link copied to clipboard!');
                });
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showSuccess('Link copied!');
            }
        }
        
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            document.querySelector('.container').insertBefore(errorDiv, document.getElementById('app-content'));
            
            setTimeout(() => errorDiv.remove(), 5000);
        }
        
        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'success';
            successDiv.textContent = message;
            document.querySelector('.container').insertBefore(successDiv, document.getElementById('app-content'));
            
            setTimeout(() => successDiv.remove(), 3000);
        }
        
        function formatDate(date) {
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (html5QrCode) {
                html5QrCode.stop();
            }
        });
        
        // Close modal on click outside
        document.getElementById('imageModal').addEventListener('click', (e) => {
            if (e.target.id === 'imageModal') {
                closeImageModal();
            }
        });
    </script>
</body>
</html>
